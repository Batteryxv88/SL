<svg width="120" height="120" viewBox="40 35 120 120" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="#cccccc" stroke-width="2">
    <!-- Верхняя грань -->
    <ellipse cx="100" cy="60" rx="50" ry="20" />

    <!-- Боковые линии -->
    <line x1="50" y1="60" x2="50" y2="130" />
    <line x1="150" y1="60" x2="150" y2="130" />

    <!-- Вертикальная линия смещена вправо на 50%, от нижней точки верхнего эллипса до нижней точки нижнего -->
    <line x1="125" y1="77" x2="125" y2="147" />

    <!-- Нижняя грань — передняя часть эллипса -->
    <path d="M50 130 A50 20 0 0 0 150 130" />

    <!-- Внутреннее отверстие -->
    <ellipse cx="100" cy="60" rx="8" ry="4" />
  </g>
</svg>
